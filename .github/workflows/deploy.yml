# Veroeffentlicht die Web-App bei jedem Stand auf "main" automatisch auf
# GitHub Pages:  https://thesolutionist001.github.io/i-need-you-app/
#
# So funktioniert es: Die App wird gebaut und das Ergebnis in den Zweig
# "gh-pages" geschrieben. GitHub Pages liefert diesen Zweig aus
# (einmalig einschalten: Repository -> Settings -> Pages -> Branch "gh-pages").
#
# Zu den Werten unten: Das sind bewusst KEINE Geheimnisse. Supabase-Adresse,
# "publishable key" und OneSignal-App-ID stecken in jeder ausgelieferten App
# und sind fuer die Veroeffentlichung gedacht - den Zugriff regeln die
# Sicherheitsregeln der Datenbank (RLS). Geheime Schluessel (service_role,
# OneSignal-REST-Key) stehen hier NICHT und gehoeren auch nie hierher.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      QCLI_SUPABASE_URL: https://chdhkkgenxskblezfbrl.supabase.co
      QCLI_SUPABASE_ANON_KEY: sb_publishable_QpPaJW2GlQSVuoZbjnEZqw_cth38CvE
      QCLI_ONESIGNAL_APP_ID: 65aedf84-8676-464d-a55f-1641a3e6b25c
      NEXXUP_PUBLIC_PATH: /i-need-you-app/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Zugangsdaten fuer den Build bereitstellen
        run: |
          {
            echo "QCLI_SUPABASE_URL=$QCLI_SUPABASE_URL"
            echo "QCLI_SUPABASE_ANON_KEY=$QCLI_SUPABASE_ANON_KEY"
            echo "QCLI_ONESIGNAL_APP_ID=$QCLI_ONESIGNAL_APP_ID"
          } > .env

      - name: Tests
        run: npm test

      - name: App bauen
        run: npx quasar build

      - name: In den Zweig gh-pages schreiben
        run: |
          cd dist/spa
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
